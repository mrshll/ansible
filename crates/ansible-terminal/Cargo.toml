[package]
name = "ansible-terminal"
description = "libghostty-vt backed terminal: PTY lifecycle, terminal state, input encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately free of Tauri, GTK, and hub dependencies. This crate must build
# and run as a standalone binary; that is what keeps the composition model a
# swappable decision rather than a rewrite.
[dependencies]
crossbeam-channel.workspace = true
libc.workspace = true
portable-pty.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
bindgen = "0.72.1"

# Not inheriting the workspace lints: this crate is a C binding, so the
# workspace's `unsafe_code = "forbid"` cannot apply. Unsafe is confined to
# `sys.rs` (generated) and the thin wrappers in `vt/`, each with a SAFETY note —
# `clippy::undocumented_unsafe_blocks` below is what actually holds us to that.
#
# Otherwise this is the workspace block from the root Cargo.toml, restated
# because Cargo cannot inherit part of a `[lints]` table. Keep them in step.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
ptr_as_ptr = "warn"
undocumented_unsafe_blocks = "warn"

[[example]]
name = "vt-fixture"
path = "examples/vt_fixture.rs"

[[example]]
name = "vt-latency"
path = "examples/vt_latency.rs"

[[example]]
name = "vt-record"
path = "examples/vt_record.rs"

[[example]]
name = "vt-drive"
path = "examples/vt_drive.rs"
