[package]
name = "ansible-hub-module"
description = "SpacetimeDB module: the hub schema and reducer surface"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A SpacetimeDB module is a wasm32-unknown-unknown cdylib, so it cannot be a
# member of the root workspace: `cargo test --workspace` would try to build it
# for the host target, where the bindings do not link. The root Cargo.toml
# excludes this directory for that reason.
[lib]
crate-type = ["cdylib"]

[dependencies]
# `unstable` is required for `#[client_visibility_filter]` — the row-level
# security attribute. Despite the "not enforced" TODO in the 2.7.0 bindings, the
# filters *are* enforced on deployed Maincloud; scripts/probe-rls.sh is the
# evidence. See docs/spikes/deployed-round-trip.md.
spacetimedb = { version = "2.7.0", features = ["unstable"] }
# Only for reading custom JWT claims out of `JwtClaims::raw_payload`, which is a
# JSON string. See the `whoami` reducer.
serde_json = "1"

# Cargo has no partial inheritance and this crate is outside the workspace, so
# the root Cargo.toml's lint posture is restated here rather than inherited.
# Keep the copies in step — see the note in the root Cargo.toml.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
ptr_as_ptr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
# Modules are shipped as wasm; size matters more than compile time.
opt-level = "z"
lto = true
codegen-units = 1
