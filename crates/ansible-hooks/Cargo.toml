[package]
name = "ansible-hooks"
description = "Claude Code hook payload types and session status derivation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure and I/O-free: the caller supplies the JSON and the timestamps, so
# recorded sessions replay as tests.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

# Inherits the workspace lints, including `unsafe_code = "forbid"`.
[lints]
workspace = true
